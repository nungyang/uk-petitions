name: Deploy Dashboard

on:
  workflow_run:
    workflows: ["Daily Scraper 2"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-to-railway:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # NOTE: `railway down` is deliberately not used here - it deletes the
      # deployment record entirely, which then makes the `redeploy` step below
      # fail with "no active deployment to reference" and leaves the service
      # down for good. Setting the overlap window to 0 instead makes Railway
      # tear down the old container as soon as the new one is up, so they
      # never run side-by-side, without breaking the redeploy that follows.
      - name: Disable deployment overlap
        run: railway variables --service="web" --skip-deploys --set "RAILWAY_DEPLOYMENT_OVERLAP_SECONDS=0"

      # Restarts the existing (GitHub-sourced) deployment in place, rather than
      # railway up/down which tries to upload local source - this service is
      # configured for GitHub auto-deploy, and local-source uploads fight that.
      - name: Restart dashboard
        run: railway redeploy --service="web" --yes
