name: Deploy Dashboard

on:
  workflow_run:
    workflows: ["Daily Scraper 2"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-to-railway:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Removes the currently running deployment first so the old and new
      # deployments don't briefly overlap - the dashboard is down for the
      # short gap until the redeploy below finishes, which is acceptable here.
      - name: Stop existing deployment
        run: railway down --service="web" --yes

      # Restarts the existing (GitHub-sourced) deployment in place, rather than
      # railway up/down which tries to upload local source - this service is
      # configured for GitHub auto-deploy, and local-source uploads fight that.
      - name: Restart dashboard
        run: railway redeploy --service="web" --yes
