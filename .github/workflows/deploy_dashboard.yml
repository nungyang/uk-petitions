name: Deploy Dashboard

on:
  workflow_run:
    workflows: ["Daily Scraper 2"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-to-railway:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # `railway restart` reuses the existing deployment image in place, with
      # no rebuild and no new deployment record - so there's no old/new
      # overlap to manage, and no risk of a flaky rebuild breaking the
      # container (which is what happened when this used `railway redeploy`,
      # which rebuilds from source every time). `railway down` was also tried
      # and rejected - it deletes the deployment record entirely, which then
      # makes any follow-up redeploy fail with "no active deployment to
      # reference" and leaves the service down for good.
      - name: Restart dashboard
        run: railway restart --service="web" --yes
