name: Deploy Dashboard

on:
  workflow_run:
    workflows: ["Daily Scraper 2"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-to-railway:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # `railway restart` was tried instead of this (no rebuild, no overlap by
      # design) but produced no visible effect via GitHub Actions and locally,
      # and was dropped. `railway down` was also tried and rejected - it
      # deletes the deployment record entirely, which then makes any
      # follow-up redeploy fail with "no active deployment to reference" and
      # leaves the service down for good.
      #
      # The RAILWAY_DEPLOYMENT_OVERLAP_SECONDS=0 service variable (set once
      # directly on the service, not here) makes Railway tear down the old
      # container as soon as the new one is up, so they never run side-by-
      # side. It's deliberately NOT set on every run via `railway variables
      # --skip-deploys` - that flag doesn't actually skip the deploy (tested:
      # it still kicks off a build), which would double the compute cost of
      # every run instead of avoiding overlap cost.
      #
      # Redeploys the existing (GitHub-sourced) build, rather than railway up
      # which tries to upload local source - this service is configured for
      # GitHub auto-deploy, and local-source uploads fight that.
      - name: Restart dashboard
        run: railway redeploy --service="web" --yes
